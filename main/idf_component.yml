#
# Keep minimal -- the dependency graph is wired via EXTRA_COMPONENT_DIRS
# (sibling repos) and the local components/mono_bridge shim.
dependencies:
  idf:
    version: ">=6.0"

  # mDNS. net-core gets this transitively via espressif/esp_rainmaker; this
  # SKU has no RainMaker, so it must be declared. Same major as net-core
  # resolves, to keep the two firmwares on one mDNS implementation.
  espressif/mdns: "^1.9.0"
