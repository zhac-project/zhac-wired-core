name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # zhac-wired-core consumes its siblings as read-only inputs, resolved by
      # relative path, so CI has to lay them out the same way the workspace
      # does: all repos checked out side by side.
      - uses: actions/checkout@v4
        with:
          path: zhac-wired-core

      - uses: actions/checkout@v4
        with:
          repository: zhac-project/zhac-components
          path: zhac-components

      - uses: actions/checkout@v4
        with:
          repository: zhac-project/zhac-net-core
          path: zhac-net-core

      - uses: actions/checkout@v4
        with:
          repository: zhac-project/embedded-zhc
          path: embedded-zhc

      - name: SKU invariants
        working-directory: zhac-wired-core
        run: ./tools/check_sku_invariants.sh

      - name: Build (esp32p4)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0
          target: esp32p4
          path: zhac-wired-core

      # A line in sdkconfig.defaults can do nothing in two ways, and only one
      # of them is noisy. This job covers the noisy one: unknown symbols, which
      # kconfgen warns about but does not fail on.
      - name: No unknown Kconfig symbols
        working-directory: zhac-wired-core
        run: |
          if grep -q 'unknown kconfig symbol' build/log/*.txt 2>/dev/null; then
            echo "FAIL: sdkconfig.defaults contains symbols this IDF ignores" >&2
            grep -h 'unknown kconfig symbol' build/log/*.txt >&2
            exit 1
          fi
          echo "OK: no unknown kconfig symbols."

      # ...and this covers the SILENT one: a symbol kconfgen knows but cannot
      # select gets dropped to the choice default with no warning at all.
      # CONFIG_ESP32P4_REV_MIN_0 without CONFIG_ESP32P4_SELECTS_REV_LESS_V3
      # silently becomes _301 -- a binary for the wrong P4 silicon family,
      # which fails at flash time, long after a green build.
      - name: Resolved chip config matches main-core
        working-directory: zhac-wired-core
        run: ./tools/check_resolved_config.sh
