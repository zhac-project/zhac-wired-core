name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32p4
            idf: v6.0
          # ESP32-S31 SKU. Blocked on ONE thing: ESP-IDF has no esp32s31
          # target before v6.1 (preview in v6.1-beta1). The library half is
          # solved -- esp-zigbee-lib 2.0.4 ships esp32s31 libs including the
          # native radio flavor (verified 2026-08-15), so ^2.0.4 is the floor.
          # Enable this row once a v6.1 lands -- and keep the IDF version
          # PINNED PER ROW. Do not move the P4 row onto a beta IDF to unify
          # them; the P4 is the shipping SKU.
          # - target: esp32s31
          #   idf: v6.1
    name: build (${{ matrix.target }} / idf ${{ matrix.idf }})
    steps:
      # zhac-wired-core consumes its siblings as read-only inputs, resolved by
      # relative path, so CI has to lay them out the same way the workspace
      # does: all repos checked out side by side -- at the commits
      # release-manifest.json names, never at a moving branch, so a green
      # build here means the same inputs a release build resolves.
      # fetch-depth 0: the app version comes from `git describe`, which on a
      # shallow checkout degrades to a bare hash.
      - uses: actions/checkout@v4
        with:
          path: zhac-wired-core
          fetch-depth: 0

      - name: Pinned sibling revisions
        id: pins
        working-directory: zhac-wired-core
        run: |
          for r in zhac-components zhac-net-core embedded-zhc zhac-main-core www-spa zhac-docs; do
            sha=$(jq -er ".siblings[\"$r\"]" release-manifest.json)
            echo "${r//-/_}=$sha" >> "$GITHUB_OUTPUT"
            echo "$r @ $sha"
          done

      - uses: actions/checkout@v4
        with:
          repository: zhac-project/zhac-components
          ref: ${{ steps.pins.outputs.zhac_components }}
          path: zhac-components

      - uses: actions/checkout@v4
        with:
          repository: zhac-project/zhac-net-core
          ref: ${{ steps.pins.outputs.zhac_net_core }}
          path: zhac-net-core

      - uses: actions/checkout@v4
        with:
          repository: zhac-project/embedded-zhc
          ref: ${{ steps.pins.outputs.embedded_zhc }}
          path: embedded-zhc

      # components/lua_engine and components/lua_cjson compile zhac-main-core's
      # sources in place; without this checkout CMake stops at configure.
      - uses: actions/checkout@v4
        with:
          repository: zhac-project/zhac-main-core
          ref: ${{ steps.pins.outputs.zhac_main_core }}
          path: zhac-main-core

      - name: SKU invariants
        working-directory: zhac-wired-core
        run: ./tools/check_sku_invariants.sh

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: zhac-wired-core

      # A line in sdkconfig.defaults can do nothing in two ways, and only one
      # of them is noisy. This job covers the noisy one: unknown symbols, which
      # kconfgen warns about but does not fail on.
      - name: No unknown Kconfig symbols
        working-directory: zhac-wired-core
        run: |
          if grep -q 'unknown kconfig symbol' build/log/*.txt 2>/dev/null; then
            echo "FAIL: sdkconfig.defaults contains symbols this IDF ignores" >&2
            grep -h 'unknown kconfig symbol' build/log/*.txt >&2
            exit 1
          fi
          echo "OK: no unknown kconfig symbols."

      # ...and this covers the SILENT one: a symbol kconfgen knows but cannot
      # select gets dropped to the choice default with no warning at all.
      # CONFIG_ESP32P4_REV_MIN_0 without CONFIG_ESP32P4_SELECTS_REV_LESS_V3
      # silently becomes _301 -- a binary for the wrong P4 silicon family,
      # which fails at flash time, long after a green build.
      - name: Resolved chip config matches main-core
        working-directory: zhac-wired-core
        run: ./tools/check_resolved_config.sh
