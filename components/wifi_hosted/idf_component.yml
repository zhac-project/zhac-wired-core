#
# Reached only through the gated rule in main/idf_component.yml. The same rule
# is repeated on both dependencies so a default build, which still discovers
# this directory, never fetches them either.
#
# Same pins as tools/c6-rcp-installer: the pair known to build on IDF 6.0.
# tools/build-p4-wifi-hosted.sh builds the C5 image from THIS esp_hosted's
# slave/ project, so host and co-processor always speak one protocol version.
#
# esp_wifi_remote only on the P4: IDF 6.1 (the S31's) ships it inside
# esp_wifi, and the registry copy then registers as an empty component.
#
# No esp_hosted with ZHAC_WIFI_NATIVE (S31 on its own radio): its constructor
# would start the SPI link before app_main. Two traps in that rule:
# - the component manager (3.0.3) reads `a && b && c` as `a && b` and drops c,
#   so every group of three is parenthesised;
# - ZHAC_WIFI_NATIVE exists in sdkconfig only on the S31 with Wi-Fi on (its
#   prompt is hidden elsewhere, and a hidden n is not written), and a missing
#   name stops the build, so the P4 half never reaches it.
dependencies:
  idf: ">=6.0"
  espressif/esp_hosted:
    version: "==2.12.13"
    rules:
      - if: '(target == "esp32p4" && $CONFIG{ZHAC_WIFI_HOSTED} == True) || (target == "esp32s31" && ($CONFIG{ZHAC_WIFI_HOSTED} == True && $CONFIG{ZHAC_WIFI_NATIVE} == False))'
  espressif/esp_wifi_remote:
    version: ">=0.10,<2.0"
    rules:
      - if: 'target == "esp32p4" && $CONFIG{ZHAC_WIFI_HOSTED} == True'
